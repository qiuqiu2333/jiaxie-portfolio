<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jia Xie</title>
    <meta name="description" content="Jia Xie 作品集" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="page-shell">
      <header class="topbar">
        <div class="title-block">
          <h1 class="brand">Jia Xie</h1>
          <div class="eyebrow">Portfolio</div>
        </div>
      </header>

      <section class="viewer-box" aria-label="作品集浏览器">
        <div class="viewer-toolbar">
          <span class="toolbar-dot dot-one"></span>
          <span class="toolbar-dot dot-two"></span>
          <span class="toolbar-dot dot-three"></span>
          <span id="fileName" class="file-name">Detective.pdf</span>
        </div>

        <div id="pdfViewerContainer" class="pdf-container">
          <iframe id="pdfViewer" title="Jia Xie PDF viewer" loading="lazy"></iframe>
        </div>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
